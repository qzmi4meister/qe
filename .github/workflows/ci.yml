name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check file operations and UI
        run: ./scripts/check.sh
      - name: Build application
        run: ./scripts/build.sh
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ui-check
          path: .build/ui-check/
          if-no-files-found: ignore
